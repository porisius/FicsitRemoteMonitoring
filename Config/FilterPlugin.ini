[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll
;
; INERT FOR THIS PROJECT'S PACKAGING PIPELINE: build/package.sh runs Alpakit's PackagePlugin
; (which extends BuildCookRun), and BuildCookRun never reads FilterPlugin.ini. Raw folders
; (Icons, www, JSON, Resources, Debug) are actually bundled into the packaged artifact via
; Config/PluginSettings.ini's [StageSettings] +AdditionalNonUSFDirectories= entries, which
; already list Icons and www. Adding entries here has zero effect on the packaged zip.
